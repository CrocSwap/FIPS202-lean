name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELAN_TOOLCHAIN: leanprover/lean4:v4.35.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lean
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install compiler supervisor
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/buildtools-venv"
          "$RUNNER_TEMP/buildtools-venv/bin/python" -m pip install "lean-buildtools @ git+https://github.com/CrocSwap/lean-buildtools.git@024d7809058e0a64d5af7e715389c387e245f824"
          echo "$RUNNER_TEMP/buildtools-venv/bin" >> "$GITHUB_PATH"
      - name: Compile specification and all 68 guards
        run: lean-buildtools build Fips202Tests --project . --output .lake/reports/ci-tests --memory 1400 --deny-sorry --no-mathlib-build
